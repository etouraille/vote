<div class="mx-auto max-w-3xl px-4 py-8">
  <header class="flex items-center pb-3">
    <a routerLink="/home" class="text-sm text-slate-500 hover:underline">&larr; Retour</a>
  </header>

  @if (loading()) {
    <p class="mt-6 text-sm text-slate-400">Chargement…</p>
  } @else if (loadError(); as error) {
    <p class="mt-6 text-sm text-red-600">{{ error }}</p>
  } @else if (text(); as text) {
    <h1 class="text-xl font-semibold text-slate-900">{{ text.title }}</h1>

    <article class="mt-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
      <!-- whitespace-pre-wrap: content is stored as plain text, so its own
           line breaks are all the structure it has — collapsing them would
           run every paragraph together. -->
      <p class="text-sm whitespace-pre-wrap text-slate-700">{{ text.content }}</p>
    </article>
  }
</div>
