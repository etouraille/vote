<!-- The gradient of the app icon, which the mobile app shows on its own
     sign-in screen: the three surfaces a visitor meets before having an
     account are the ones that have to say which product this is. -->
<div
  class="min-h-screen flex items-center justify-center bg-linear-to-br from-gradient-start to-gradient-end px-4"
>
  <form class="w-full max-w-sm rounded-xl border border-slate-200 bg-white p-8 shadow-sm" (ngSubmit)="submit()">
    <h1 class="text-xl font-semibold text-slate-900">Connexion</h1>

    <label class="mt-6 block text-sm font-medium text-slate-700">
      Email
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none"
      />
    </label>

    <label class="mt-4 block text-sm font-medium text-slate-700">
      Mot de passe
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none"
      />
    </label>

    @if (error()) {
      <p class="mt-4 text-sm text-removed-ink">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="submitting()"
      class="mt-6 w-full rounded-md bg-brand hover:bg-brand-ink px-4 py-2 text-sm font-medium text-white disabled:opacity-50"
    >
      {{ submitting() ? 'Connexion…' : 'Se connecter' }}
    </button>

    <a routerLink="/register" class="mt-4 block text-center text-sm text-slate-500 hover:underline">
      Pas de compte ? S'inscrire
    </a>

    <div class="mt-6 flex items-center gap-3 text-xs text-slate-400">
      <span class="h-px flex-1 bg-slate-200"></span>
      ou
      <span class="h-px flex-1 bg-slate-200"></span>
    </div>

    <div class="mt-4 flex justify-center">
      <div #googleButton></div>
    </div>

    @if (googleUnavailable()) {
      <p class="mt-4 text-center text-sm text-slate-500">
        La connexion Google est indisponible (script Google non chargé — vérifiez la connexion réseau
        ou un bloqueur de publicités).
      </p>
    }

    @if (needsPseudoForGoogleSignIn()) {
      <div class="mt-4 rounded-md border border-slate-200 bg-slate-50 p-4">
        <label class="block text-sm font-medium text-slate-700">
          Choisissez un pseudo pour finaliser votre inscription
          <input
            type="text"
            name="pseudo"
            [(ngModel)]="pseudo"
            required
            class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none"
          />
        </label>
        <button
          type="button"
          (click)="continueGoogleSignIn()"
          [disabled]="submitting() || !pseudo"
          class="mt-3 w-full rounded-md bg-brand hover:bg-brand-ink px-4 py-2 text-sm font-medium text-white disabled:opacity-50"
        >
          {{ submitting() ? 'Connexion…' : 'Continuer' }}
        </button>
      </div>
    }
  </form>
</div>
