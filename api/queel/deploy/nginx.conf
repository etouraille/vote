# Round-robin reverse proxy in front of the 3 queel cluster nodes' public
# API ports (8091/8092/8093 — see node1.env/node2.env/node3.env). The nodes
# run on the host via `make up`, not in docker, hence host.docker.internal
# below (see the `lb` service's extra_hosts in ../../docker-compose.yml).
#
# Round-robin is nginx's default upstream algorithm, so no directive names
# it. Open-source nginx has no active health checking (that's an nginx-plus
# feature) — max_fails/fail_timeout give passive fault tolerance instead: a
# node that fails twice within 5s is skipped for the next 5s, so a dead node
# stops getting new requests without anyone reconfiguring this file by hand.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream vote_api_cluster {
        # Without `zone`, each nginx worker process keeps its own
        # independent round-robin cursor (starting over at the first
        # server) instead of sharing one — with worker_processes auto on a
        # multi-core box that skews traffic hard towards the first server
        # under light load. The shared memory zone fixes that.
        zone vote_api_cluster 64k;
        server host.docker.internal:8091 max_fails=2 fail_timeout=5s;
        server host.docker.internal:8092 max_fails=2 fail_timeout=5s;
        server host.docker.internal:8093 max_fails=2 fail_timeout=5s;
    }

    # Slightly above the api's own withBodyLimit cap (2 MiB — see
    # api/middleware.go) so that limit, with its own JSON error body, is
    # what actually rejects an oversized request instead of nginx's generic
    # 413.
    client_max_body_size 3m;

    # Default nginx access log doesn't say which node actually answered;
    # $upstream_addr does, which is worth having on hand when something's
    # wrong with only one of the 3 nodes.
    log_format upstream_log '$remote_addr - "$request" $status upstream=$upstream_addr';
    access_log /var/log/nginx/access.log upstream_log;

    server {
        listen 80;

        location / {
            proxy_pass http://vote_api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
